<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expressões da Emoção</title>
  <style>
    body {
      font-family: 'Times New Roman', Times, serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ffea00, #11ff00);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative; /* necessário para posicionar o botão */
    }

    /* Botão Voltar Home fora do quadro */
    .btn-home {
      position: absolute;
      top: 15px;
      left: 15px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      color: #000;
      background: linear-gradient(135deg, #00ff08, #fff700);
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
      text-decoration: none;
      z-index: 999; /* garante que fique acima do quadro */
    }

    .btn-home:hover {
      background: linear-gradient(135deg, #11ff00, #ffe600);
      transform: scale(1.05);
    }

    /* Quadro principal */
    .layout-quadro {
      width: 95%;
      height: 95%;
      background: rgb(255, 252, 251);
      border: 1px solid #000000;
      border-radius: 25px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: fadeIn 1.2s ease-in-out;
      position: relative;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    header {
      text-align: center;
      padding: 20px;
      background: rgb(255, 252, 251);
      position: relative;
    }

    header img {
      width: 150px;
      height: auto;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      margin: 10px 0;
      font-size: 36px;
      font-weight: bold;
      color: #ffed49;
      text-shadow: 0 0 10px #126e00, 0 0 20px #26ff00;
      letter-spacing: 2px;
    }

    h2 {
      text-align: center;
      margin: 10px 0;
      font-size: 22px;
      color: #000000;
    }

    /* Barra de botões */
    .accordion-container {
      display: flex;
      justify-content: space-around;
      border-top: 3px solid #000000;
      border-bottom: 3px solid #000000;
      padding: 10px;
      background: linear-gradient(to right, #006122, #1aff00);
    }

    .accordion {
      flex: 1;
      margin: 0 8px;
      padding: 15px;
      cursor: pointer;
      background: #fff;
      color: #868a00;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .accordion:hover {
      background: #000000;
      color: #09ff00;
      transform: scale(1.05);
    }

    .accordion.active {
      background: #ffffff;
      color: #000;
      box-shadow: 0 0 15px rgb(51, 255, 0);
    }

    /* Painéis */
    .panel {
      flex: 1;
      display: none;
      padding: 25px;
      background: #fafafa;
      border-top: 1px solid #ccc;
      overflow-y: auto;
      animation: slideIn 0.5s ease;
    }

    .panel.active {
      display: block;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 15px;
      color: #8f8f8f;
    }
  </style>
</head>
<body>
  <!-- Botão Voltar Home fora do quadro -->
  <a href="Expressões da Emoção.html" class="btn-home">Voltar Home</a>

  <main class="layout-quadro">
    <header>
      <img src="Tarefas/Logotipo [João].png" alt="Logotipo">
      <h1>Expressões das Emoções</h1>
      <h2>MENU</h2>
    </header>

    <!-- Botões -->
    <div class="accordion-container">
      <button class="accordion" data-target="panel1">O que são Emoções?</button>
      <button class="accordion" data-target="panel2">Catálogo de Expressões</button>
      <button class="accordion" data-target="panel3">Artigos e Pesquisas</button>
      <button class="accordion" data-target="panel4">Ciência das Emoções</button>
      <button class="accordion" data-target="panel5">Museu das Expressões</button>
    </div>

    <!-- Painéis -->
    <div id="panel1" class="panel"></div>
    <div id="panel2" class="panel"></div>
    <div id="panel3" class="panel"></div>
    <div id="panel4" class="panel"></div>
    <div id="panel5" class="panel"></div>

    <footer>
      © 2026 Expressões da Emoção — Todos os direitos reservados
    </footer>
  </main>

  <script>
    const buttons = document.querySelectorAll(".accordion");

    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".panel").forEach(panel => {
          panel.classList.remove("active");
        });
        buttons.forEach(b => b.classList.remove("active"));
        const targetId = btn.getAttribute("data-target");
        document.getElementById(targetId).classList.add("active");
        btn.classList.add("active");
      });
    });
  </script>
</body>
</html>
