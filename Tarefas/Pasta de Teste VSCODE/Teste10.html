<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Accordion Exemplo</title>
  <style>
    .accordion {
      background-color: #eee;
      cursor: pointer;
      padding: 10px;
      width: 100%;
      border: none;
      text-align: left;
      outline: none;
      font-size: 16px;
      transition: background-color 0.3s;
    }

    .accordion:hover {
      background-color: #ccc;
    }

    .accordion:after {
      content: '\25BC'; /* seta para baixo */
      float: right;
    }

    .accordion.active:after {
      content: '\25B2'; /* seta para cima */
    }

    .panel {
      padding: 0 10px;
      display: none;
      background-color: #f9f9f9;
      overflow: hidden;
    }
  </style>
</head>
<body>

<h2>Accordion com Toggle</h2>

<button class="accordion">Clique aqui para expandir</button>
<div class="panel">
  <p>Este é o texto que aparece ao expandir o accordion.</p>
</div>

<script>
  const acc = document.querySelector(".accordion");
  const panel = document.querySelector(".panel");

  acc.addEventListener("click", function() {
    this.classList.toggle("active");
    if (panel.style.display === "block") {
      panel.style.display = "none";
    } else {
      panel.style.display = "block";
    }
  });
</script>

</body>
</html>
